<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D sinov — ot</title>
    <style>
      html, body { margin: 0; height: 100%; background: linear-gradient(#cfe9f7, #fdf3dc); font-family: system-ui, sans-serif; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      .bar { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 2; }
      .bar button { border: 0; border-radius: 999px; padding: 10px 18px; font-size: 16px; font-weight: 800; background: #fff; box-shadow: 0 3px 0 #0002; cursor: pointer; }
      .bar button.on { background: #ffd166; }
      .flat { position: fixed; left: 16px; bottom: 16px; width: 22vmin; background: #fff8; border-radius: 16px; padding: 8px; text-align: center; font-weight: 800; color: #3d2c1e; z-index: 2; }
      .flat img { width: 100%; display: block; }
      .hint { position: fixed; right: 16px; bottom: 16px; background: #fff; border-radius: 12px; padding: 8px 12px; font-size: 14px; color: #3d2c1e; z-index: 2; }
      #msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; color: #3d2c1e; z-index: 2; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="bar" id="bar"></div>
    <div class="flat"><img src="/assets/art/animal/ot.png" alt="" /><div>2D rasm</div></div>
    <div class="hint">👆 Sudrab aylantiring · ✌️ yaqinlashtiring</div>
    <div id="msg"></div>
    <script type="module">
      import * as THREE from 'three'
      import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js'
      import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'
      import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js'

      const MODELS = [
        ['TRELLIS', '/models-test/ot-trellis.glb'],
        ['Hunyuan3D', '/models-test/ot-hunyuan.glb'],
      ]
      const host = document.getElementById('app')
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
      renderer.outputColorSpace = THREE.SRGBColorSpace
      renderer.toneMapping = THREE.ACESFilmicToneMapping
      renderer.shadowMap.enabled = true
      renderer.toneMappingExposure = 1.35
      host.appendChild(renderer.domElement)
      const scene = new THREE.Scene()
      // Atrofdan tushadigan yumshoq yorug'lik (studiya) — plastilin rangi asl rasmdagidek yorqin chiqsin
      scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture
      const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100)
      camera.position.set(0, 0.35, 3)
      scene.add(new THREE.HemisphereLight('#fff7e6', '#c9a27e', 2.2))
      const sun = new THREE.DirectionalLight('#fff', 2.5)
      sun.position.set(2, 4, 3)
      sun.castShadow = true
      scene.add(sun)
      const ground = new THREE.Mesh(new THREE.CircleGeometry(1.2, 48), new THREE.ShadowMaterial({ opacity: 0.25 }))
      ground.rotation.x = -Math.PI / 2
      ground.position.y = -0.5
      ground.receiveShadow = true
      scene.add(ground)
      const controls = new OrbitControls(camera, renderer.domElement)
      controls.enableDamping = true
      controls.autoRotate = true
      controls.autoRotateSpeed = 1.2
      controls.minDistance = 1.2
      controls.maxDistance = 6
      controls.target.set(0, 0, 0)

      let current = null
      const TIME = { value: 0 }
      const holder = new THREE.Group()
      scene.add(holder)
      const loader = new GLTFLoader()
      const bar = document.getElementById('bar')
      const msg = document.getElementById('msg')
      async function show(i) {
        ;[...bar.children].forEach((b, k) => b.classList.toggle('on', k === i))
        msg.textContent = 'Yuklanmoqda…'
        try {
          const g = await loader.loadAsync(MODELS[i][1])
          if (current) holder.remove(current)
          current = g.scene
          const box = new THREE.Box3().setFromObject(current)
          const size = box.getSize(new THREE.Vector3())
          const k = 1 / Math.max(size.x, size.y, size.z)
          current.scale.setScalar(k)
          const c = box.getCenter(new THREE.Vector3()).multiplyScalar(k)
          current.position.set(-c.x, -c.y, -c.z)
          current.traverse((o) => o.isMesh && ((o.castShadow = true), (o.receiveShadow = true)))
          // Skeletsiz "jonlantirish": dum (orqa uchi) chayqaladi, bosh irg'itadi — vertex shader'da
          current.traverse((o) => {
            if (!o.isMesh) return
            o.geometry.computeBoundingBox()
            const bb = o.geometry.boundingBox
            const sx = bb.max.x - bb.min.x
            const sy = bb.max.y - bb.min.y
            const u = { uTime: TIME, uTailX: { value: bb.min.x + sx * 0.2 }, uMinX: { value: bb.min.x }, uHeadX: { value: bb.max.x - sx * 0.32 }, uMaxX: { value: bb.max.x }, uMidY: { value: bb.min.y + sy * 0.5 }, uSize: { value: Math.max(sx, sy) } }
            o.material.onBeforeCompile = (sh) => {
              Object.assign(sh.uniforms, u)
              sh.vertexShader = 'uniform float uTime, uTailX, uMinX, uHeadX, uMaxX, uMidY, uSize;\n' + sh.vertexShader.replace(
                '#include <begin_vertex>',
                `#include <begin_vertex>
                float tail = smoothstep(uTailX, uMinX, position.x);
                transformed.z += sin(uTime * 5.0 - tail * 2.0) * tail * tail * uSize * 0.09;
                transformed.y += sin(uTime * 5.0) * tail * tail * uSize * 0.02;
                float head = smoothstep(uHeadX, uMaxX, position.x) * step(uMidY, position.y);
                float nod = sin(uTime * 2.2) * 0.12 * head;
                transformed.y += nod * (position.x - uHeadX);
                transformed.x -= nod * (position.y - uMidY) * 0.3;`,
              )
            }
            o.material.needsUpdate = true
          })
          holder.add(current)
          msg.textContent = ''
        } catch {
          msg.textContent = MODELS[i][0] + ' modeli hali tayyor emas'
        }
      }
      MODELS.forEach(([name], i) => {
        const b = document.createElement('button')
        b.textContent = name
        b.onclick = () => show(i)
        bar.appendChild(b)
      })
      show(0)
      function resize() {
        renderer.setSize(innerWidth, innerHeight)
        camera.aspect = innerWidth / innerHeight
        camera.updateProjectionMatrix()
      }
      addEventListener('resize', resize)
      resize()
      const clock = new THREE.Clock()
      renderer.setAnimationLoop(() => {
        const t = clock.getElapsedTime()
        TIME.value = t
        // Yengil "nafas" va sakrash — jonli ko'rinsin
        holder.position.y = Math.abs(Math.sin(t * 2.2)) * 0.03
        holder.scale.set(1, 1 + Math.sin(t * 4.4) * 0.01, 1)
        controls.update()
        renderer.render(scene, camera)
      })
    </script>
  </body>
</html>
